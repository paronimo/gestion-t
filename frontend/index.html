<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Se aplica el tema antes de pintar para que no haya destello al cargar.
      (function () {
        try {
          var saved = localStorage.getItem('gestor-tema');
          if (saved !== 'claro' && saved !== 'oscuro') {
            saved = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
          }
          document.documentElement.dataset.theme = saved;
        } catch (error) {
          document.documentElement.dataset.theme = 'claro';
        }
      })();
    </script>
    <title>Gestor de salidas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
